name: Release
on:
  push:
    tags:
      - '*'

defaults:
  run:
    shell: bash

jobs:
  Publish:
    runs-on: ubuntu-latest

    env:
      ZIPOPT: ${{ matrix.os == 'osx' && '-y' || '' }}

    permissions:
      contents: write

    strategy:
      matrix:
        os: [linux, osx, win]
        arch: [x64, arm64]
        include:
          - dir: Linux
            os: linux
          - dir: Mac
            os: osx
          - dir: Windows
            os: win

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          persist-credentials: false
          ref: ${{ github.ref }}

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x

      - name: Setup Node.JS
        uses: actions/setup-node@v6
        with:
          node-version: 26

      - name: Install zip packager
        run: sudo apt install zip

      - name: Run server tests
        run: dotnet test

      - name: Install app dependencies
        run: yarn install
        env:
          YARN_ENABLE_SCRIPTS: false

      - name: Run app tests
        run: yarn test

      - name: Build app
        run: yarn build

      - name: Publish ${{ matrix.dir }} ${{ matrix.arch }} release
        run: dotnet publish ${{ matrix.dir }} --sc -c Release -r ${{ matrix.os }}-${{ matrix.arch }} -o publish/${{ matrix.os }}-${{ matrix.arch }}

      - name: Prepare macOS command-line application
        if: matrix.os == 'osx'
        run: |
          curl -fsSL https://github.com/indygreg/apple-platform-rs/releases/download/apple-codesign/0.29.0/apple-codesign-0.29.0-x86_64-unknown-linux-musl.tar.gz -o "$RUNNER_TEMP/rcodesign.tar.gz"
          echo "dbe85cedd8ee4217b64e9a0e4c2aef92ab8bcaaa41f20bde99781ff02e600002  $RUNNER_TEMP/rcodesign.tar.gz" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/rcodesign.tar.gz" -C "$RUNNER_TEMP"
          release="publish/osx-${{ matrix.arch }}"
          contents="$release/WiFiSurveyor.app/Contents"
          mkdir -p "$contents/MacOS" "$contents/Resources"
          mv "$release/WiFiSurveyor" "$contents/MacOS/"
          mv "$release/wwwroot" "$contents/Resources/"
          ln -s ../Resources/wwwroot "$contents/MacOS/wwwroot"
          cp Mac/Info.plist "$contents/"
          cp Mac/WiFiSurveyor "$release/WiFiSurveyor"
          chmod +x "$release/WiFiSurveyor"
          "$RUNNER_TEMP/apple-codesign-0.29.0-x86_64-unknown-linux-musl/rcodesign" sign "$release/WiFiSurveyor.app"

      - name: Package ${{ matrix.dir }} ${{ matrix.arch }} release
        working-directory: publish/${{ matrix.os }}-${{ matrix.arch }}
        run: zip -9 -r ../WiFiSurveyor-$(echo ${{ github.ref }} | sed 's/refs\/tags\///')-${{ matrix.dir }}-${{ matrix.arch }}.zip *

      - name: Upload packaged release
        uses: softprops/action-gh-release@v3
        with:
          files: |
            publish/*.zip
